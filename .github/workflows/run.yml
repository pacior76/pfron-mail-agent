name: PFRON mail agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"   # codziennie 08:00 UTC (ok. 9:00 PL zimą)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # WERSJA TESTOWA: wysyła maila testowego przy ręcznym uruchomieniu
      - name: Run PFRON agent (test email)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TO_EMAIL: jacek@pacior.lap.pl
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FORCE_TEST_EMAIL: "1"
        run: |
          python pfron_agent.py

      # WERSJA PRODUKCYJNA: w harmonogramie wysyła tylko jeśli są nowe ogłoszenia
      - name: Run PFRON agent (scheduled)
        if: ${{ github.event_name == 'schedule' }}
        env:
          TO_EMAIL: jacek@pacior.lap.pl
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FORCE_TEST_EMAIL: "0"
        run: |
          python pfron_agent.py

      - name: Save state (if any)
        run: |
          if [ -f state_seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state_seen.json
            git commit -m "Update state" || echo "No changes"
            git push || echo "Nothing to push"
          fi
