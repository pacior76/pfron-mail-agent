name: PFRON mail agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PFRON agent (diagnostic)
        env:
          TO_EMAIL: jacek@pacior.lap.pl
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          echo "=== TRY 1: smtp.pacior.lap.pl (465 SSL) ==="
          SMTP_HOST=smtp.pacior.lap.pl python pfron_agent.py || true
          echo "=== TRY 2: mail.pacior.lap.pl (465 SSL) ==="
          SMTP_HOST=mail.pacior.lap.pl python pfron_agent.py || true
          echo "=== DONE ==="

      - name: Save state (if any)
        run: |
          if [ -f state_seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state_seen.json
            git commit -m "Update state" || echo "No changes"
            git push || echo "Nothing to push"
          fi
