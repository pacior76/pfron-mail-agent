name: PFRON mail agent

on:
  schedule:
    - cron: "0 8 * * *"   # codziennie 08:00 UTC (ok. 9:00 PL zimą)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PFRON agent
        env:
          TO_EMAIL: jacek@pacior.lap.pl
          SMTP_HOST: smtp.pacior.lap.pl
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python pfron_agent.py

      - name: Save state
        run: |
          if [ -f state_seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state_seen.json
            git commit -m "Update state" || echo "No changes"
            git push || echo "Nothing to push"
          fi
